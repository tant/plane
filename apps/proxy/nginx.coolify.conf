# Nginx reverse proxy for Plane on Coolify
# This handles path-based routing internally
# SSL termination is handled by Coolify's Caddy proxy

upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:8000;
}

upstream admin_upstream {
    server admin:3000;
}

upstream space_upstream {
    server space:3000;
}

upstream live_upstream {
    server live:3000;
}

# Note: MinIO is accessed via shared Coolify service, not internal
# If you need to proxy to MinIO, uncomment and configure:
# upstream minio_upstream {
#     server minio-m0444os4gkcksockk4os4kwc:9000;
# }

server {
    listen 80;
    server_name _;

    # Increase client body size for file uploads
    client_max_body_size 100M;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # API routes
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Auth routes
    location /auth/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files from API
    location /static/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spaces app
    location /spaces/ {
        proxy_pass http://space_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /spaces {
        return 301 /spaces/;
    }

    # Admin/God-mode app
    location /god-mode/ {
        proxy_pass http://admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /god-mode {
        return 301 /god-mode/;
    }

    # Live collaboration (WebSocket support)
    location /live/ {
        proxy_pass http://live_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # MinIO/S3 uploads bucket - proxy to shared MinIO service
    # The bucket name is configurable via BUCKET_NAME env var
    # Note: This requires the container to be on the same network as MinIO
    location ~ ^/uploads(/.*)?$ {
        # Using resolver for dynamic upstream resolution
        resolver 127.0.0.11 valid=30s;
        set $minio_upstream "http://minio-m0444os4gkcksockk4os4kwc:9000";
        proxy_pass $minio_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default - Main web app
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
