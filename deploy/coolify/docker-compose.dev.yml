# ===========================================
# Plane Development - Coolify Deployment
# ===========================================
# Branch: oss
# Self-contained: Tất cả services chạy local, không phụ thuộc external

x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: ${POSTGRES_DB:-plane_dev}
  POSTGRES_USER: ${POSTGRES_USER:-plane_dev}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane_dev}
  POSTGRES_DB: ${POSTGRES_DB:-plane_dev}
  POSTGRES_PORT: "5432"
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://plane-redis:6379/

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-plane_minio}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-plane_minio_secret}

x-storage-env: &storage-env
  USE_MINIO: "1"
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-plane_minio}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-plane_minio_secret}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: ${STORAGE_BUCKET:-uploads}

x-mq-env: &mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-http://localhost}
  DEBUG: "1"
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  DATABASE_URL: postgresql://${POSTGRES_USER:-plane_dev}:${POSTGRES_PASSWORD:-plane_dev}@plane-db/${POSTGRES_DB:-plane_dev}
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-please-change}
  AMQP_URL: amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD:-plane}@plane-mq:5672/${RABBITMQ_VHOST:-plane}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-120/minute}
  MINIO_ENDPOINT_SSL: "0"
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-dev-live-secret}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-10485760}

services:
  # ===========================================
  # Proxy - Entry point (gán domain vào service này)
  # ===========================================
  proxy:
    build:
      context: ../../apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-10485760}
      BUCKET_NAME: ${STORAGE_BUCKET:-uploads}
    depends_on:
      - web
      - admin
      - space
      - api
      - live
    networks:
      - plane-net

  # ===========================================
  # Frontend Services
  # ===========================================
  web:
    build:
      context: ../..
      dockerfile: ./apps/web/Dockerfile.web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - plane-net

  admin:
    build:
      context: ../..
      dockerfile: ./apps/admin/Dockerfile.admin
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - plane-net

  space:
    build:
      context: ../..
      dockerfile: ./apps/space/Dockerfile.space
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - plane-net

  live:
    build:
      context: ../..
      dockerfile: ./apps/live/Dockerfile.live
    restart: always
    environment:
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-dev-live-secret}
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
    depends_on:
      api:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    networks:
      - plane-net

  # ===========================================
  # Backend Services
  # ===========================================
  migrator:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.api
    command: ./bin/docker-entrypoint-migrator.sh
    restart: "no"
    environment:
      <<: [*app-env, *db-env, *redis-env, *storage-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    exclude_from_hc: true
    networks:
      - plane-net

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.api
    command: ./bin/docker-entrypoint-api.sh
    restart: always
    environment:
      <<: [*app-env, *db-env, *redis-env, *storage-env]
    depends_on:
      migrator:
        condition: service_completed_successfully
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - plane-net

  worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.api
    command: ./bin/docker-entrypoint-worker.sh
    restart: always
    environment:
      <<: [*app-env, *db-env, *redis-env, *storage-env]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - plane-net

  beat-worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.api
    command: ./bin/docker-entrypoint-beat.sh
    restart: always
    environment:
      <<: [*app-env, *db-env, *redis-env, *storage-env]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - plane-net

  # ===========================================
  # Infrastructure Services (tất cả chạy local)
  # ===========================================
  plane-db:
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=500'
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane_dev} -d ${POSTGRES_DB:-plane_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plane-net

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plane-net

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    environment:
      <<: *mq-env
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - plane-net

  plane-minio:
    image: minio/minio:latest
    restart: always
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    volumes:
      - storagedata:/export
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - plane-net

networks:
  plane-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  mqdata:
  storagedata:
