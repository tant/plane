# ===========================================
# Plane Production - Coolify Deployment
# ===========================================
# Branch: oss
# Uses shared Coolify services: PostgreSQL, Redis, MinIO
# Only builds application services to reduce deployment time

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-https://plane.carp.vn}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  # Database - Shared PostgreSQL
  DATABASE_URL: ${DATABASE_URL}
  PGHOST: ${POSTGRES_HOST}
  PGDATABASE: ${POSTGRES_DB:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: "5432"
  # Redis - Shared Redis
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL}
  # Storage - Shared MinIO
  USE_MINIO: "1"
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  MINIO_ENDPOINT_SSL: "0"
  # RabbitMQ - Internal
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
  AMQP_URL: amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD:-plane}@plane-mq:5672/${RABBITMQ_VHOST:-plane}
  # Application
  SECRET_KEY: ${SECRET_KEY}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-120/minute}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-10485760}

services:
  # ===========================================
  # Proxy - Entry point (assign domain to this service)
  # ===========================================
  proxy:
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-10485760}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - web
      - admin
      - space
      - api
      - live

  # ===========================================
  # Frontend Services
  # ===========================================
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
    restart: always
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
    restart: always
    depends_on:
      api:
        condition: service_healthy

  space:
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
    restart: always
    depends_on:
      api:
        condition: service_healthy

  live:
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
    restart: always
    environment:
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      api:
        condition: service_healthy

  # ===========================================
  # Backend Services
  # ===========================================
  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    command: ./bin/docker-entrypoint-migrator.sh
    restart: "no"
    environment:
      <<: *app-env
    depends_on:
      plane-mq:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    command: ./bin/docker-entrypoint-api.sh
    restart: always
    environment:
      <<: *app-env
    depends_on:
      migrator:
        condition: service_completed_successfully
      plane-mq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    command: ./bin/docker-entrypoint-worker.sh
    restart: always
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_healthy

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    command: ./bin/docker-entrypoint-beat.sh
    restart: always
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_healthy

  # ===========================================
  # RabbitMQ - Internal Service (no shared alternative)
  # ===========================================
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mqdata:
