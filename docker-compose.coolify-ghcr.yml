# ===========================================
# Plane Production - Coolify Deployment (Pre-built Images from GHCR)
# ===========================================
# Branch: oss
# Uses pre-built images from GitHub Container Registry
#
# Architecture:
#   Coolify's Caddy (SSL termination) -> Nginx proxy (path routing) -> App services
#
# IMPORTANT: In Coolify UI:
#   1. Assign domain https://plane.carp.vn to "proxy" service
#   2. Set IMAGE_TAG variable (defaults to 'oss' - the branch name)
#   3. The proxy listens on port 80 (HTTP only, Coolify handles SSL)

x-image-tag: &image-tag ${IMAGE_TAG:-oss}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-https://plane.carp.vn}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  # Database - Internal PostgreSQL
  DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:5432/${POSTGRES_DB:-plane}
  PGHOST: plane-db
  PGDATABASE: ${POSTGRES_DB:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: "5432"
  # Redis - Internal Valkey
  REDIS_HOST: plane-redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://plane-redis:6379
  # Storage - Internal MinIO (proxied through Nginx for public access)
  USE_MINIO: "1"
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
  # Internal endpoint for API to access MinIO directly (no SSL)
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  # IMPORTANT: Set to "1" because presigned URLs are accessed by browser via HTTPS (Coolify's Caddy)
  MINIO_ENDPOINT_SSL: "1"
  # RabbitMQ - Internal
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
  AMQP_URL: amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD:-plane}@plane-mq:5672/${RABBITMQ_VHOST:-plane}
  # Application
  SECRET_KEY: ${SECRET_KEY}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-120/minute}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-10485760}

services:
  # ===========================================
  # Nginx Proxy - Path-based routing (Coolify handles SSL)
  # ===========================================
  # Assign domain https://plane.carp.vn to this service in Coolify
  proxy:
    image: ghcr.io/tant/plane-proxy:${IMAGE_TAG:-latest}
    restart: always
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-10485760}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - admin
      - space
      - api
      - live
      - plane-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================
  # Frontend Services
  # ===========================================
  web:
    image: ghcr.io/tant/plane-web:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      api:
        condition: service_healthy

  admin:
    image: ghcr.io/tant/plane-admin:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      api:
        condition: service_healthy

  space:
    image: ghcr.io/tant/plane-space:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      api:
        condition: service_healthy

  live:
    image: ghcr.io/tant/plane-live:${IMAGE_TAG:-latest}
    restart: always
    environment:
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379
    depends_on:
      api:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  # ===========================================
  # Backend Services
  # ===========================================
  migrator:
    image: ghcr.io/tant/plane-api:${IMAGE_TAG:-latest}
    command: ./bin/docker-entrypoint-migrator.sh
    restart: "no"
    exclude_from_hc: true
    environment:
      <<: *app-env
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy

  api:
    image: ghcr.io/tant/plane-api:${IMAGE_TAG:-latest}
    command: ./bin/docker-entrypoint-api.sh
    restart: always
    environment:
      <<: *app-env
    depends_on:
      migrator:
        condition: service_completed_successfully
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  worker:
    image: ghcr.io/tant/plane-api:${IMAGE_TAG:-latest}
    command: ./bin/docker-entrypoint-worker.sh
    restart: always
    exclude_from_hc: true
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_healthy

  beat-worker:
    image: ghcr.io/tant/plane-api:${IMAGE_TAG:-latest}
    command: ./bin/docker-entrypoint-beat.sh
    restart: always
    exclude_from_hc: true
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_healthy

  # ===========================================
  # Infrastructure Services
  # ===========================================
  plane-db:
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane} -d ${POSTGRES_DB:-plane}"]
      interval: 10s
      timeout: 5s
      retries: 5

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  plane-minio:
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  mqdata:
  uploads:
